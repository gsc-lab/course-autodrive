# config.yaml — 모든 프로그램(collector / curator / trainer / inference)이 공유하는 단일 설정 파일.
# 학생이 바꿔도 되는 값에는 주석을 달아 두었다. 키 이름을 틀리면 로드 시 오류가 난다.

schema_version: 1

# ----------------------------------------------------------------------------
# 조향
# ----------------------------------------------------------------------------
steering:
  mode: discrete            # discrete | continuous
  classes: [30, 60, 90, 120, 150]   # discrete 모드 클래스(서보 각도, 도). 학생이 7단계·9단계 등으로 수정 가능
  center: 90                # 중앙 각도. discrete 모드에서는 classes 에 포함되어야 함
  min: 30                   # 기구 한계(서보가 이 범위를 넘지 않음)
  max: 150
  step_deg: 5               # continuous 모드에서 D패드/키보드 한 번에 움직이는 각도
  invert: false             # 스틱을 왼쪽으로 밀었는데 차가 오른쪽으로 꺾이면 true
  hysteresis: 0.15          # discrete 모드: 인접 클래스 경계에서 떨림 방지 (클래스 간격 대비 비율)

# ----------------------------------------------------------------------------
# 구동(DC 모터) 속도. 단위는 PWM 듀티 %
# ----------------------------------------------------------------------------
throttle:
  max_speed: 60             # 전진 속도 상한. levels 의 값은 이보다 클 수 없다
  levels: [30, 45, 60]      # 전진 속도 단계. R2 를 당긴 깊이를 이 단계 중 하나로 묶는다 (파일 이름의 속도 라벨이 이 값만 나온다)
                            #   첫 값은 차가 바닥에서 실제로 출발하는 가장 낮은 듀티로. 단계 수는 자유. [] 이면 0~max_speed 연속
  trigger_deadzone: 0.10    # R2/L2 를 이만큼(0~1) 당기기 전에는 정지
  level_hysteresis: 0.15    # 단계 경계에서 속도가 오르내리며 떨리지 않게 하는 여유 (단계 폭 대비 비율)
  default_speed: 40         # 키보드 모드 초기 속도 (levels 가 있으면 가장 가까운 단계로 맞춘다)
  step: 10                  # 키보드 A/Z 한 번당 속도 변화 (levels 가 있으면 한 단계씩)
  reverse_max_speed: 30     # 후진 속도. levels 가 있으면 L2 를 당기는 즉시 이 값, 없으면 깊이에 비례 (후진 프레임은 저장하지 않음)

# ----------------------------------------------------------------------------
# 하드웨어. 서보와 모터 신호는 모두 I2C(Jetson 핀 3 SDA, 5 SCL = i2c-7)에 연결한 PCA9685 두 장이 낸다.
# 배선 전체는 docs/wiring.pdf. Jetson 헤더의 PWM 핀은 쓰지 않는다 (구동력이 약해 서보가 움직이지 않음).
# ----------------------------------------------------------------------------
hardware:
  backend: jetson           # jetson | mock   (mock 은 PC에서 로직만 돌려볼 때)
  motor:
    pwm_hz: 1500            # 모터 PWM 주파수. PCA9685 가 낼 수 있는 24~1526 Hz (MDD10A 는 20 kHz 까지 받음)
  dir_forward_high: true    # "전진"인데 뒤로 가면 false 로 (모터선 교환 대신 쓸 수 있음)
  servo:
    pwm_hz: 50
    min_us: 500             # LD-1501MG 펄스 폭
    max_us: 2500
    min_deg: 0
    max_deg: 180
    backlash_comp_deg: 0    # 조향 유격 보정(차마다 다름, 0 = 끔). 양수: 높은 각도에서 낮은 각도로 올 때 목표를 이만큼 지나쳤다가
                            #   되돌아와 항상 같은 방향에서 멈춘다. 반대 방향에서 못 미치면 음수. 시험: pin_test.py servo --backlash=N
    backlash_settle_sec: 0.08   # 지나친 위치에서 머무는 시간(초). 이동 시간은 따로 더해진다
  pca9685:                  # 서보용 보드. 배선: 핀 3 SDA, 5 SCL, 1 VCC(3.3 V), 6 GND, 단자대 V+ 에 UBEC 6 V
    bus: 7                  # 핀 3/5 = i2c-7 (핀 27/28 이면 1). 확인: i2cdetect -y -r 7 또는 uv run python scripts/pin_test.py scan
    address: 0x40           # 보드의 주소 패드를 안 건드렸으면 0x40
    channel: 0              # 서보를 꽂은 채널 (단자대를 위로 두었을 때 맨 왼쪽이 0, 보드 인쇄 확인)
    osc_hz: 25000000        # 내부 오실레이터 공칭값. 실제 펄스가 1.5 ms 보다 길거나 짧으면 보정
  pca9685_motor:            # 모터용 보드. 서보 보드와 SDA/SCL/VCC/GND 를 같이 잇고 A0 패드(인쇄상 맨 오른쪽)를 납땜 → 0x41
    bus: 7
    address: 0x41           # 서보 보드(0x40)와 달라야 한다: 보드당 주파수가 하나
    pwm_channel: 0          # 채널 0 PWM 핀 -> MDD10A PWM1 (왼쪽 모터 속도)
    dir_channel: 1          # 채널 1 PWM 핀 -> MDD10A DIR1 (왼쪽 모터 방향). 속도 선과 방향 선이 바뀌면 한 방향만 돈다
    # 기본 배선은 채널 0 → J4 → PWM1·PWM2, 채널 1 → J5 → DIR1·DIR2 로 WAGO 분기 블록에서 나누어 채널 0·1 만 쓴다 (docs/wiring.pdf 그림 2).
    # 채널 넷으로 따로 꽂은 보드라면 아래를 2, 3 으로 두면 채널 0·1 과 같은 값을 낸다.
    pwm_channel_2: -1       # 채널 N PWM 핀 -> MDD10A PWM2. -1 이면 안 씀
    dir_channel_2: -1       # 채널 N PWM 핀 -> MDD10A DIR2. -1 이면 안 씀
    osc_hz: 25000000
  stop_decay_step: 5        # 감속 정지: 한 단계에 줄이는 듀티 %
  stop_decay_delay: 0.02    # 감속 단계 사이 시간(초)

# ----------------------------------------------------------------------------
# 카메라 (USB 웹캠)
# ----------------------------------------------------------------------------
camera:
  device: 0                 # /dev/video0 → 0. 경로 문자열도 가능
  width: 640
  height: 480
  fps: 30
  fourcc: MJPG
  jpeg_quality: 95
  auto_exposure: null       # null 이면 드라이버 기본값. V4L2 값 (예: 1 = 수동, 3 = 자동)
  exposure: null            # auto_exposure 를 수동으로 둔 경우의 노출값

# ----------------------------------------------------------------------------
# 녹화
# ----------------------------------------------------------------------------
recording:
  root: dataset             # 세션 폴더 dataset/YYYYMMDD_HHMM/ 이 여기에 생김
  interval_sec: 0.5         # 저장 간격(초). 주행 중 [ ] 키로 조정 가능
  interval_min: 0.1
  interval_max: 1.0
  mark_seconds: 3.0         # □ / M 키: 직전 몇 초를 불량으로 표시할지
  min_free_gb: 1.0          # 디스크 여유가 이보다 적으면 시작하지 않음

# ----------------------------------------------------------------------------
# 입력 장치
# ----------------------------------------------------------------------------
input:
  primary: ds4              # ds4 | keyboard
  keyboard_fallback: true   # 패드를 못 찾으면 키보드(SSH 터미널)로 대체
  ds4:
    device_name: "Wireless Controller"   # vendor 054c / product 09cc 로 못 찾을 때 쓰는 이름
    layout: auto              # auto | sony | generic. JetPack 6.2.1 커널에는 hid-sony 가 없어 generic 으로 잡힌다
    codes: {}                 # 보드에서 `uv run python -m common.inputs.ds4` 로 확인한 코드로 덮어쓰기. 예: {record: 0x132}
    deadman: false            # false(기본): R2 를 당긴 만큼 전진, 놓으면 정지. true 면 L1 을 누르고 있는 동안만 모터가 돈다
    stick_deadzone: 0.08
    rumble: true              # sony 계열 드라이버에서만 동작
    lightbar: true            # sony 계열 드라이버에서만 동작
    link_timeout_sec: 0.5     # 패드가 보내는 HID 보고(가만히 있어도 초당 수백 개)가 이 시간 동안 없으면 연결 끊김으로 보고 즉시 정지

# ----------------------------------------------------------------------------
# 안전
# ----------------------------------------------------------------------------
safety:
  deadman_sec: 30           # 키보드 모드(토글 주행): 입력 없이 주행이 이 시간을 넘으면 자동 정지. 트리거 주행에는 적용 안 함

# ----------------------------------------------------------------------------
# 상태 표시 (선택): MAX7219 8×8 도트 매트릭스를 Jetson 핀 2(5 V), 20(GND), 19(DIN), 23(CLK), 24(CS) 에 직결.
# 위 5행 = 방향(▲ 전진 ▼ 후진 ■ 정지, 녹화 중 모서리 점멸), 7행 = 조향 위치, 8행 = 속도 막대, 오류 = X 점멸.
# 장치가 없으면 경고만 남기고 표시 없이 주행한다.
# ----------------------------------------------------------------------------
display:
  enabled: true
  driver: max7219
  spi_dev: /dev/spidev0.0   # SPI1 CS0. jetson-io 로 spi1 을 켜야 생긴다 (scripts/jetson_setup.sh install)
  intensity: 3              # 밝기 0~15
  rotate: 90                # 모듈을 돌려 달았으면 0 | 90 | 180 | 270. 기준 차에서는 90 (핀 헤더가 위로 오게 달았을 때)
  flip: false               # 좌우가 거울처럼 보이면 true
  blink_hz: 2.0

# ----------------------------------------------------------------------------
# 이미지 전처리 (학습·추론 공용). 학습 시 model_meta.json 에 복사되어 모델과 함께 다닌다
# ----------------------------------------------------------------------------
preprocess:
  crop_top_ratio: 0.4       # 상단 40 % 제거 (하늘/배경)
  crop_bottom_ratio: 1.0
  out_width: 200            # PilotNet 입력
  out_height: 66
