# config.yaml — 설정 파일
#
#   1부  데이터 수집   → 차(Jetson)에서 고친다
#   2부  모델 학습     → PC 에서 고친다
#
# 같은 파일이 차와 PC 에 하나씩 있으므로, 각 부분은 그 값을 쓰는 쪽에서 고쳐야 적용된다.
# [내 차] 는 조립한 뒤 자기 차에 한 번 맞추는 값이다.
# 값을 잘못 적으면 프로그램을 시작할 때 [설정 오류] 로 알려 준다.

# ============================================================================
# 1부. 데이터 수집
#      차를 운전하며 사진을 찍을 때 쓰는 값이다. 차(Jetson)에 SSH 로 접속해서 고친다.
# ============================================================================

# --- 조향 --------------------------------------------------------------------
# classes, center, min, max 는 조립한 뒤 재서 적는다:  uv run python scripts/servo_calibrate.py
steering:
  mode: discrete            # discrete: 스틱을 가장 가까운 단계로 묶는다 | continuous: 스틱대로 연속 (학습 때는 가장 가까운 단계로 묶인다)
  classes: [30, 60, 90, 120, 150]   # 조향 단계(서보 각도). 모델의 클래스가 된다. 7단계, 9단계로 바꿔도 된다
  center: 90                # [내 차] 직진 각도. discrete 모드에서는 classes 에 있어야 한다
  min: 30                   # [내 차] 조향 한계. classes 는 모두 min~max 안에 있어야 한다
  max: 150                  # [내 차]
  invert: false             # [내 차] 스틱과 반대로 꺾이면 true

# --- 속도 (PWM 듀티 %) -------------------------------------------------------
throttle:
  levels: [30, 45, 60]      # 전진 속도 단계. R2 를 당긴 깊이에 따라 이 중 하나가 된다
                            #   첫 값은 차가 출발하는 가장 낮은 값으로. [] 이면 당긴 만큼 연속 (0~max_speed)
  max_speed: 60             # 전진 속도 상한. levels 는 이 값을 넘을 수 없다
  reverse_max_speed: 30     # 후진 속도

# --- 촬영 --------------------------------------------------------------------
recording:
  interval_sec: 0.5         # 사진 저장 간격(초). 0.1~1.0
  mark_seconds: 3.0         # □ 버튼이 불량으로 표시하는 직전 시간(초)

# --- 카메라 노출 -------------------------------------------------------------
# 비워 두면(null) 카메라가 자동으로 맞춘다. 사진이 번지거나 밝기가 들쭉날쭉할 때만 고정한다.
# 값의 범위는 카메라마다 다르다. 바꾼 뒤에는 짧게 찍어 PC 에서 사진을 확인한다.
camera:
  auto_exposure: null       # 1 = 수동, 3 = 자동
  exposure: null            # 수동일 때의 노출값. 작을수록 덜 번지고 어둡다

# --- 패드 --------------------------------------------------------------------
input:
  ds4:
    deadman: false          # true 면 L1 을 누르고 있는 동안만 달린다 (더 안전)

# ============================================================================
# 2부. 모델 학습
#      수집한 사진으로 모델을 학습할 때 쓰는 파라미터다. PC 에서 고친다.
# ============================================================================

# --- 전처리: 사진을 모델에 넣기 전에 줄인다 ----------------------------------
# 사진에서 잘라 낼 범위(위, 아래)는 여기가 아니라 가공 프로그램에서 사진을 보며 정한다.
preprocess:
  out_width: 200            # 모델에 넣는 크기. 기본값은 PilotNet 의 200×66
  out_height: 66

# --- 학습:  uv run -m trainer train dataset/dataset_*.zip --------------------
# 조향 클래스는 데이터셋을 따른다 (여기서 맞추지 않는다). 결과는 models/<실행 이름>/ 에 모인다.
# 값을 하나씩 바꿔 가며 학습 곡선과 시험 결과가 어떻게 달라지는지 비교해 보자.
training:
  model: pilotnet           # pilotnet | small_cnn
  seed: 42                  # 같은 값이면 결과가 같다 (값 하나만 바꿔 비교할 수 있다)
  epochs: 50                # 최대 에폭 수
  rescale: minmax           # 입력 스케일링: none(0~255 그대로) | minmax(0~1) | standardize(평균 0, 표준편차 1)

  split:                    # 데이터 나누기. 세 값의 합은 1
    train: 0.7              # 학습: 가중치를 고치는 데 쓴다
    val: 0.15               # 검증: 에폭마다 확인해 가장 좋은 모델을 고른다
    test: 0.15              # 시험: 학습이 끝난 뒤 한 번만 쓴다. 0 이면 시험 분석을 하지 않는다
    stratify: true          # 조향 클래스 비율을 세 묶음에서 같게 맞춘다
    block_size: 1           # 연속한 사진 N장을 같은 묶음에 넣는다. 이웃한 사진은 닮아서, 키우면 시험 점수가 덜 부풀려진다

  augment:
    hflip: random           # 좌우 반전: none | random(절반 확률로) | both(원본과 뒤집은 것 모두, 2배)
                            #   라벨도 반대쪽 클래스로 바뀐다. 조향 클래스가 좌우 대칭일 때만 쓸 수 있다

  loader:
    batch_size: 32          # 한 번에 계산하는 사진 수
    shuffle: true           # 학습 데이터를 에폭마다 섞는다

  early_stopping:
    enabled: true           # false 면 epochs 만큼 끝까지 학습한다
    patience: 10            # 검증 손실이 이 에폭 수만큼 나아지지 않으면 멈춘다

  optimizer:
    name: adam              # adam | sgd
    lr: 0.001               # 학습률
    weight_decay: 0.0       # 가중치 감쇠
    momentum: 0.9           # sgd 에서만 쓴다
    schedule: constant      # 학습률 변화: constant(일정) | warmup(증가) | decay(감소) | warmup_decay(증가 후 감소)
    warmup_epochs: 5        # 증가에 쓰는 에폭 수
    min_lr_ratio: 0.01      # 감소의 마지막 학습률 = lr × 이 값

  loss:
    class_weight: none      # none | balanced(사진이 적은 클래스의 오답에 더 큰 벌점)
