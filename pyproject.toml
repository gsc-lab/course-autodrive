[project]
name = "course-autodrive"
version = "0.1.0"
description = "Lane-keeping RC car (Jetson Orin Nano) — collector / curator / trainer / inference"
readme = "readme.md"
requires-python = ">=3.10,<3.14"   # Jetson JetPack 6 = 3.10, PySide6/torch 휠은 3.13 까지
# 모든 프로그램이 공통으로 쓰는 것. 플랫폼 조건은 마커로 건다: `uv run` 은 환경을 여기에 정확히 맞추므로
# Jetson 에서 쓰는 것을 extra 로 빼 두면 옵션 없이 `uv run` 한 순간 지워진다 (2026-11-10 실제로 겪음).
dependencies = [
    "pyyaml>=6.0",
    "numpy>=1.26; platform_machine != 'aarch64'",
    "numpy>=1.24,<2; platform_machine == 'aarch64'",   # Jetson: 시스템 TensorRT/OpenCV 가 numpy 1.x 기준
    "opencv-python>=4.9",
    "evdev>=1.7; sys_platform == 'linux'",             # DualShock 4 입력 (Jetson). tensorrt/cuda 는 JetPack 시스템 패키지 → --system-site-packages
]

[project.optional-dependencies]
# PC 전용. gui = curator(PySide6, 수백 MB), train = trainer(torch).
# torch 는 둘 중 하나만 고른다: train = NVIDIA GPU 용(CUDA 12.8, 수 GB), train-cpu = GPU 없는 PC 용(수백 MB)
#   GPU PC :  uv sync --extra gui --extra train
#   노트북 :  uv sync --extra gui --extra train-cpu
gui = [
    "PySide6>=6.7",
]
train = [
    "torch>=2.11,<2.12",          # GPU 용과 CPU 용이 같은 버전이 되게 묶는다 (cu128 인덱스의 최신이 2.11)
    "torchvision>=0.26,<0.27",
    "onnx>=1.16",
    "onnxruntime>=1.18",     # 내보낸 ONNX 가 PyTorch 와 같은 답을 내는지 확인
    "matplotlib>=3.8",       # 학습 곡선, 혼동 행렬 그림
]
train-cpu = [
    "torch>=2.11,<2.12",          # GPU 용과 CPU 용이 같은 버전이 되게 묶는다 (cu128 인덱스의 최신이 2.11)
    "torchvision>=0.26,<0.27",
    "onnx>=1.16",
    "onnxruntime>=1.18",
    "matplotlib>=3.8",
]

[dependency-groups]
dev = ["pytest>=8.0"]

# ---------------------------------------------------------------------------
# uv
# ---------------------------------------------------------------------------
[tool.uv]
# GPU 용 torch 와 CPU 용 torch 는 같은 환경에 함께 깔 수 없다
conflicts = [
    [{ extra = "train" }, { extra = "train-cpu" }],
]
# 잠금 파일을 만들 때 고려할 환경: 개발 PC(Windows/x86-64 Linux)와 Jetson(aarch64 Linux)
environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
]

# torch 는 PyPI 가 아니라 PyTorch 인덱스에서 받는다 (PC 전용. Jetson 은 torch 를 쓰지 않음)
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", extra = "train" },
    { index = "pytorch-cpu", extra = "train-cpu" },
]
torchvision = [
    { index = "pytorch-cu128", extra = "train" },
    { index = "pytorch-cpu", extra = "train-cpu" },
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
